<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6c515"><title>El Capricho Club · Admin</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{--y:#f6c515;--red:#b42318;--ok:#16794d}*{box-sizing:border-box}body{margin:0;background:#efede7;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#fffaf0;padding-bottom:40px}header{background:#ffd126;padding:25px;text-align:center}header img{width:88px;height:88px;object-fit:contain;border-radius:20px;background:#fff;padding:6px}h1{margin:7px 0}main{padding:18px}.card{background:#fff;border:1px solid #eee;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 6px 20px #0001}input,button,select{width:100%;padding:13px;border-radius:13px;font-size:16px}input,select{border:1px solid #ddd;margin:6px 0 10px}button{border:0;background:var(--y);font-weight:800;margin-top:7px}.secondary{background:#222;color:#fff}.ghost{background:#f3f3f3}.danger{background:#ffe3df;color:var(--red);border:1px solid #ffc5bd}.hidden{display:none}.small{font-size:13px;color:#6d6d6d}.badge{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:5px 9px;font-size:12px}.points{font-size:34px;font-weight:900}.cash{background:#fff8d6;border-radius:15px;padding:13px;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scanner{background:#111;color:#fff}.scanner h2{color:#ffd329}#reader{background:#fff;border-radius:15px;overflow:hidden;margin-top:12px;min-height:260px}#scanStatus{padding-top:10px;font-weight:700}.recovery{background:#eaf8f1;border-radius:15px;padding:13px;margin-top:12px}.recovery-code{font-size:32px;font-weight:900;letter-spacing:5px;text-align:center;padding:12px}.move{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:8px;border-bottom:1px solid #eee}.plus{color:var(--ok);font-weight:900}.minus{color:var(--red);font-weight:900}@media(max-width:520px){.two{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><img src="../logo.png"><h1>El Capricho Club · Admin</h1><div>Pannello cassa</div></header><main><section id="loginCard" class="card"><h2>Accesso amministratore</h2><input id="email" value="rosticceriaitalianatenerife@gmail.com" readonly><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Accedi</button><div id="loginStatus"></div></section><section id="adminArea" class="hidden"><div class="card"><b>1 € = 1 punto · punti validi 15 giorni</b><button id="logoutBtn" class="secondary">Esci</button></div><div class="card scanner"><h2>📷 Scansiona tessera cliente</h2><p class="small" style="color:#ddd">Premi il pulsante e consenti l'accesso alla fotocamera.</p><button type="button" onclick="window.elCapOpenCamera()">Apri fotocamera</button><div id="reader" class="hidden"></div><div id="scanStatus"></div></div><script>window.elCapScanner=null;window.elCapOpenCamera=async function(){var st=document.getElementById('scanStatus'),rd=document.getElementById('reader');st.textContent='⏳ Comando ricevuto. Avvio fotocamera…';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='❌ Fotocamera web non disponibile. Apri questa pagina direttamente in Safari.';return}if(typeof Html5Qrcode==='undefined'){st.textContent='❌ Modulo QR non caricato.';return}try{rd.classList.remove('hidden');window.elCapScanner=new Html5Qrcode('reader');await window.elCapScanner.start({facingMode:'environment'},{fps:8,qrbox:220},async function(text){var code=String(text).trim();if(!/^EC-[A-Z0-9-]+$/i.test(code)){st.textContent='QR non valido per El Capricho.';return}st.textContent='✅ Tessera letta: '+code;try{await window.elCapScanner.stop();window.elCapScanner.clear()}catch(e){}window.elCapScanner=null;rd.classList.add('hidden');var input=document.getElementById('search');if(input)input.value=code;if(typeof search==='function')search(code)},function(){});st.textContent='📷 Fotocamera attiva: inquadra il QR del cliente.'}catch(e){st.textContent='❌ Errore fotocamera: '+(e&&e.message?e.message:String(e));rd.classList.add('hidden');window.elCapScanner=null}};</script><div class="card"><h2>🔎 Cerca cliente</h2><input id="search" placeholder="Nome, telefono o codice socio"><button id="searchBtn">Cerca</button><div id="searchStatus"></div></div><div id="results"></div></section></main></div><script>const U='https://qbddxrselxsprstvtkjn.supabase.co',K='sb_publishable_kyop1OtqIqFA1veH42AAJg_oaad6_5B',$=id=>document.getElementById(id),TK='elcap_admin_token';let token=localStorage.getItem(TK)||'';async function jf(url,o={}){let r=await fetch(url,o),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||String(d));return d}async function rpc(n,b={}){return jf(`${U}/rest/v1/rpc/${n}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:K,Authorization:`Bearer ${token}`},body:JSON.stringify(b)})}function logged(v){$('loginCard').classList.toggle('hidden',v);$('adminArea').classList.toggle('hidden',!v)}async function login(){try{let d=await jf(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.access_token;localStorage.setItem(TK,token);if(await rpc('club_admin_allowed')!==true)throw Error('Non autorizzato');logged(true);search()}catch(e){$('loginStatus').textContent='Accesso non riuscito: '+e.message}}function logout(){localStorage.removeItem(TK);token='';logged(false)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function search(q=null){if(q!==null)$('search').value=q;try{let l=await rpc('club_admin_search',{p_query:$('search').value.trim()});$('searchStatus').textContent=`${l.length} cliente/i trovati`;$('results').innerHTML=l.map(c=>`<div class="card customer"><h3>${esc(c.name)}</h3><span class="badge">${esc(c.member_code)}</span><div class="small">📞 ${esc(c.phone)}</div><div class="points">${c.points} <small>punti</small></div><div class="cash"><b>🛒 Registra acquisto</b><input class="amount" type="number" step="0.01" placeholder="Totale €"><button onclick="purchase('${c.id}',this)">➕ Registra acquisto e punti</button></div><div class="cash"><b>💶 Applica sconto</b><select class="redeem"><option value="50">50 punti → 5 €</option><option value="100">100 punti → 10 €</option><option value="150">150 punti → 15 €</option><option value="200">200 punti → 20 €</option><option value="250">250 punti → 25 €</option><option value="300">300 punti → 30 €</option></select><button class="danger" onclick="redeem('${c.id}',this)">🎁 Usa punti</button></div><div class="recovery"><b>🔑 Cliente senza accesso?</b><div class="small">Genera un codice monouso da comunicare al cliente. Vale 10 minuti.</div><button onclick="recovery('${c.id}',this)">Genera codice recupero</button><div class="recovery-code"></div></div><div class="two"><button class="ghost" onclick="history('${c.id}',this)">🧾 Storico</button><button class="ghost" onclick="navigator.clipboard.writeText('${esc(c.member_code)}')">📋 Copia codice</button></div><button class="danger" onclick="deleteCustomer('${c.id}','${esc(c.name)}',this)">🗑️ Elimina definitivamente cliente</button><div class="msg"></div><div class="history hidden"></div></div>`).join('')}catch(e){$('searchStatus').textContent='Errore: '+e.message}}async function purchase(id,b){let c=b.closest('.customer'),a=parseFloat(c.querySelector('.amount').value),m=c.querySelector('.msg');if(!a)return m.textContent='Inserisci il totale.';try{let x=(await rpc('club_admin_add_purchase',{p_customer:id,p_amount_eur:a}))[0];m.textContent=`✅ +${x.points_added} punti. Saldo ${x.new_points}.`;setTimeout(()=>search(),700)}catch(e){m.textContent='Errore: '+e.message}}async function redeem(id,b){let c=b.closest('.customer'),p=Number(c.querySelector('.redeem').value),m=c.querySelector('.msg');if(!confirm(`Usare ${p} punti per ${p/10} € di sconto?`))return;try{let x=(await rpc('club_admin_redeem_discount',{p_customer:id,p_points:p}))[0];m.textContent=`✅ Sconto ${Number(x.discount_eur).toFixed(2)} €. Restano ${x.new_points} punti.`;setTimeout(()=>search(),700)}catch(e){m.textContent=e.message.includes('INSUFFICIENT')?'Punti insufficienti.':'Errore: '+e.message}}async function recovery(id,b){let box=b.closest('.recovery').querySelector('.recovery-code');try{let code=await rpc('club_admin_create_recovery',{p_customer:id});box.textContent=code;box.previousElementSibling.textContent='Comunica questo codice al cliente. Scade tra 10 minuti.'}catch(e){box.textContent='Errore'}}async function deleteCustomer(id,name,b){if(!confirm(`Eliminare definitivamente ${name}? Verranno cancellati anche punti e storico.`))return;if(!confirm('Confermi per la seconda volta? Questa operazione non si può annullare.'))return;try{await rpc('club_admin_delete_customer',{p_customer:id});alert('Cliente eliminato.');search()}catch(e){b.closest('.customer').querySelector('.msg').textContent='Errore eliminazione: '+e.message}}async function history(id,b){let box=b.closest('.customer').querySelector('.history');try{let l=await rpc('club_admin_history',{p_customer:id,p_limit:30});box.innerHTML=l.map(x=>`<div class="move"><b class="${x.points>=0?'plus':'minus'}">${x.points>=0?'+':''}${x.points}</b><span>${esc(x.description||'Movimento')}</span><small>${new Date(x.created_at).toLocaleDateString('it-IT')}</small></div>`).join('')||'Nessun movimento';box.classList.toggle('hidden')}catch{box.textContent='Storico non disponibile';box.classList.remove('hidden')}}$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('searchBtn').onclick=()=>search();$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('password').onkeydown=e=>{if(e.key==='Enter')login()};(async()=>{if(token){try{if(await rpc('club_admin_allowed')===true){logged(true);search();return}}catch{}logout()}})();</script></body></html>
