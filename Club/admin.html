pe="button">Cerca</button><div id="searchStatus"></div></div><div id="results"></div></section></main></div><script>const U='https://qbddxrselxsprstvtkjn.supabase.co',K='sb_publishable_kyop1OtqIqFA1veH42AAJg_oaad6_5B',$=id=>document.getElementById(id),TK='elcap_admin_token',RK='elcap_admin_refresh',BK='elcap_admin_bio_v1';let token=sessionStorage.getItem(TK)||'';async function jf(url,o={}){let r=await fetch(url,o),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok){let e=Error(d?.message||d?.error_description||String(d));e.status=r.status;throw e}return d}async function refreshAccess(){let refresh=localStorage.getItem(RK);if(!refresh)return false;try{let d=await jf(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({refresh_token:refresh})});token=d.access_token;sessionStorage.setItem(TK,token);if(d.refresh_token)localStorage.setItem(RK,d.refresh_token);return true}catch{return false}}async function rpc(n,b={},retry=true){try{return await jf(`${U}/rest/v1/rpc/${n}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:K,Authorization:`Bearer ${token}`},body:JSON.stringify(b)})}catch(e){if(retry&&(e.status===401||e.status===403)&&await refreshAccess())return rpc(n,b,false);throw e}}function logged(v){$('loginCard').classList.toggle('hidden',v);$('adminArea').classList.toggle('hidden',!v)}function faceMode(){let on=!!(localStorage.getItem(BK)&&localStorage.getItem(RK));$('faceBtn').classList.toggle('hidden',!on);$('passwordBtn').classList.toggle('hidden',!on);$('passwordLogin').classList.toggle('hidden',on);$('rememberFace').checked=on;return on}function showPassword(){$('passwordLogin').classList.remove('hidden');$('passwordBtn').classList.add('hidden')}function b64u(a){let s='';new Uint8Array(a).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function smsPhone(p){return String(p||'').trim().replace(/[^+0-9]/g,'')}function smsHref(phone,text){let p=smsPhone(phone);if(!p)return '';let sep=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?';return 'sms:'+p+sep+'body='+encodeURIComponent(text)}function purchaseSms(name,added,balance){return `⭐ El Capricho Club\nCiao ${name}! Hai guadagnato ${added} punti con il tuo acquisto.\nSaldo attuale: ${balance} punti.\n🎁 Ogni 50 punti = 5 € di sconto.\n⏳ I punti sono validi 15 giorni.\nGrazie! ❤️🇮🇹`}function redeemSms(name,used,discount,balance){return `🎁 El Capricho Club\nCiao ${name}! Hai utilizzato ${used} punti e ottenuto ${Number(discount).toFixed(2)} € di sconto.\nSaldo attuale: ${balance} punti.\nGrazie! ❤️🇮🇹`}function showSmsFallback(m,phone,text,name,summary){let href=smsHref(phone,text);m.innerHTML=`<div>${summary}</div>${href?`<a class="smsSend" href="${href}">📩 APRI DI NUOVO SMS A ${esc(name).toUpperCase()}</a><div class="small">I punti sono già registrati. Se Messaggi non si apre automaticamente, usa questo pulsante.</div>`:'<div class="small">Numero non disponibile. I punti sono comunque registrati.</div>'}`}function autoSms(phone,text){let href=smsHref(phone,text);if(href)window.location.href=href}async function enableFace(refresh){if(!window.PublicKeyCredential||!navigator.credentials)throw Error('Face ID non disponibile su questo dispositivo');let ch=crypto.getRandomValues(new Uint8Array(32)),uid=crypto.getRandomValues(new Uint8Array(16));let c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'El Capricho Admin'},user:{id:uid,name:'admin@elcapricho',displayName:'El Capricho Admin'},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});localStorage.setItem(BK,JSON.stringify({id:b64u(c.rawId)}));localStorage.setIte iente/i trovati`;$('results').innerHTML=l.map(c=>`<div class="card customer" data-name="${esc(c.name)}" data-phone="${esc(c.phone)}"><h3>${esc(c.name)}</h3><span class="badge">${esc(c.member_code)}</span><div class="small">📞 ${esc(c.phone)}</div><div class="points">${c.points} <small>punti</small></div><div class="cash"><b>🛒 Registra acquisto</b><input class="amount" type="number" inputmode="decimal" step="0.01" placeholder="Totale €"><button type="button" onclick="purchase('${c.id}',this)">➕ Registra acquisto e punti</button></div><div class="cash"><b>💶 Applica sconto</b><select class="redeem"><option value="50">50 punti → 5 €</option><option value="100">100 punti → 10 €</option><option value="150">150 punti → 15 €</option><option value="200">200 punti → 20 €</option><option value="250">250 punti → 25 €</option><option value="300">300 punti → 30 €</option></select><button type="button" class="danger" onclick="redeem('${c.id}',this)">🎁 Usa punti</button></div><div class="recovery"><b>🔑 Cliente senza accesso?</b><div class="small">Genera un codice monouso da comunicare al cliente. Vale 10 minuti.</div><button type="button" onclick="recovery('${c.id}',this)">Genera codice recupero</button><div class="recovery-code"></div></div><div class="two"><button type="button" class="ghost" onclick="history('${c.id}',this)">🧾 Storico</button><button type="button" class="ghost" onclick="navigator.clipboard.writeText('${esc(c.member_code)}')">📋 Copia codice</button></div><button type="button" class="danger" onclick="deleteCustomer('${c.id}','${esc(c.name)}',this)">🗑️ Elimina definitivamente cliente</button><div class="msg"></div><div class="history hidden"></div></div>`).join('')}catch(e){$('searchStatus').textContent='Errore: '+e.message}}async function purchase(id,b){if(b.disabled)return;let c=b.closest('.customer'),inp=c.querySelector('.amount'),a=parseFloat(String(inp.value||'').replace(',','.')),m=c.querySelector('.msg'),name=c.dataset.name||'cliente',phone=c.dataset.phone||'' ){if(!confirm(`Eliminare definitivamente ${name}? Verranno cancellati anche punti e storico.`))return;if(!confirm('Confermi per la seconda volta? Questa operazione non si può annullare.'))return;try{await rpc('club_admin_delete_customer',{p_customer:id});alert('Cliente eliminato.');search()}catch(e){b.closest('.customer').querySelector('.msg').textContent='Errore eliminazione: '+e.message}}async function history(id,b){let box=b.closest('.customer').querySelector('.history');try{let l=await rpc('club_admin_history',{p_customer:id,p_limit:30});box.innerHTML=l.map(x=>`<div class="move"><b class="${x.points>=0?'plus':'minus'}">${x.points>=0?'+':''}${x.points}</b><span>${esc(x.description||'Movimento')}</span><small>${new Date(x.created_at).toLocaleDateString('it-IT')}</small></div>`).join('')||'Nessun movimento';box.classList.toggle('hidden')}catch{box.textContent='Storico non disponibile';box.classList.remove('hidden')}}window.elCapScanner=null;window.elCapOpenCamera=async function(){let st=$('scanStatus'),rd=$('reader');st.textContent='⏳ Avvio fotocamera…';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='❌ Fotocamera web non disponibile.';return}if(typeof Html5Qrcode==='undefined'){st.textContent='❌ Modulo QR non caricato.';return}try{rd.classList.remove('hidden');window.elCapScanner=new Html5Qrcode('reader');await window.elCapScanner.start({facingMode:'environment'},{fps:8,qrbox:220},async text=>{let code=String(text).trim();if(!/^EC-[A-Z0-9-]+$/i.test(code)){st.textContent='QR non valido per El Capricho.';return}st.textContent='✅ Tessera letta: '+code;try{await window.elCapScanner.stop();window.elCapScanner.clear()}catch{}window.elCapScanner=null;rd.classList.add('hidden');search(code)},()=>{});st.textContent='📷 Fotocamera attiva: inquadra il QR del cliente.'}catch(e){st.textContent='❌ Errore fotocamera: '+e.message;rd.classList.add('hidden');window.elCapScanner=null}};$('loginBtn').onclick=login;$('faceBtn').onclick=faceLogin;$('passwordBtn').onclick=showPassword;$('logoutBtn').onclick=logout;$('searchBtn').onclick=()=>search();$('cameraBtn').onclick=window.elCapOpenCamera;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('password').onkeydown=e=>{if(e.key==='Enter')login()};window.addEventListener('pageshow',()=>document.querySelectorAll('button:disabled').forEach(b=>b.disabled=false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.querySelectorAll('button:disabled').forEach(b=>b.disabled=false)});(async()=>{if(token){try{if(await rpc('club_admin_allowed')===true){logged(true);search();return}}catch{}sessionStorage.removeItem(TK);token=''}if(faceMode())setTimeout(()=>faceLogin(),350)})();</script></body></html>
